backend: {name: github, repo: jaydenford/LazarTiling, branch: main, base_url: https://lazartiling.com, auth_endpoint: api/auth}
publish_mode: simple
media_folder: images/uploads
public_folder: /images/uploads
collections:
- {name: team, label: "Team Members", files: [{name: team, label: Team, file: content/team.json, fields: [{label: Members, name: members, widget: list, fields: [{label: Name, name: name, widget: string}, {label: Role, name: role, widget: string, required: false}, {label: Photo, name: photo, widget: image, required: false}, {label: "Short bio", name: bio, widget: text, required: false}]}]}]}
- {name: gallery, label: "Recent Work Gallery", files: [{name: gallery, label: Gallery, file: content/gallery.json, fields: [{label: Photos, name: items, widget: list, fields: [{label: Photo, name: image, widget: image}, {label: Caption, name: caption, widget: string}]}]}]}
- {name: reviews, label: "Client Reviews", files: [{name: reviews, label: Reviews, file: content/testimonials.json, fields: [{label: Reviews, name: items, widget: list, fields: [{label: "Reviewer name", name: name, widget: string}, {label: Suburb, name: suburb, widget: string, required: false}, {label: "Star rating", name: rating, widget: select, options: ["5","4","3","2","1"], default: "5"}, {label: "Review text", name: quote, widget: text}]}]}]}
